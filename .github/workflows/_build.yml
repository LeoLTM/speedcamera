name: Build

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.2.0). Empty string for non-release builds.'
        type: string
        default: ''

defaults:
  run:
    working-directory: electronbun

jobs:
  build-linux:
    name: Build (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Inject release version
        if: inputs.version != ''
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          echo "Injecting version: $VERSION"
          sed -i "s/version: \"[^\"]*\"/version: \"$VERSION\"/" electrobun.config.ts
          jq --arg v "$VERSION" '.version = $v' package.json > _tmp.json && mv _tmp.json package.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build release
        run: bun run build:release

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: electronbun-release-artifacts
          path: electronbun/artifacts/**
          if-no-files-found: error
