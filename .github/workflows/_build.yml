name: Build

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.2.0 or v1.2.0-canary). Empty string for non-release builds.'
        type: string
        default: ''

defaults:
  run:
    working-directory: electronbun

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          # Does not work yet due to electronbun cli installation errors
          # on Windows runners. Windows is no prio atm anyway.
          # - os: windows-latest
          #   platform: win-x64

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Inject release version
        if: inputs.version != ''
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: bun scripts/inject-version.ts

      - name: Build
        shell: bash
        run: |
          if [[ "${{ inputs.version }}" == *"-canary"* ]]; then
            bun run build:canary
          else
            bun run build:stable
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: electronbun-artifacts-${{ matrix.platform }}
          path: electronbun/artifacts/**
          if-no-files-found: error

