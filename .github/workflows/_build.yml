name: Build

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.2.0 or v1.2.0-canary). Empty string for non-release builds.'
        type: string
        default: ''
      build-headless:
        description: 'Build headless-rust daemon'
        type: boolean
        default: true
      build-firmware:
        description: 'Build arduino firmware'
        type: boolean
        default: true

jobs:
  headless-build:
    name: Headless-Rust — Build
    if: inputs.build-headless
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: headless-rust

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libaravis-dev libudev-dev pkg-config

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      # compile embedded web assets into dist/ for rust-embed
      - name: Build frontend
        run: bun run build

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      # verify release binary compiles cleanly; no artifact upload needed (deploy not required)
      - name: Build release binary
        run: cargo build --release

  arduino-build:
    name: Arduino — Build Firmware
    if: inputs.build-firmware
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arduino

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('arduino/platformio.ini') }}
          restore-keys: platformio-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: arduino-firmware
          path: arduino/.pio/build/d1_mini/firmware.bin
          if-no-files-found: error
          retention-days: 1

