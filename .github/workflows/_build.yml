name: Build

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.2.0 or v1.2.0-canary). Empty string for non-release builds.'
        type: string
        default: ''

defaults:
  run:
    working-directory: electronbun

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          # Does not work yet due to electronbun cli installation errors
          # on Windows runners. Windows is no prio atm anyway.
          # - os: windows-latest
          #   platform: win-x64

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Download esptool binary (Linux amd64)
        shell: bash
        run: |
          curl -fsSL https://github.com/espressif/esptool/releases/download/v5.2.0/esptool-v5.2.0-linux-amd64.tar.gz \
            | tar -xz --wildcards '*/esptool' --strip-components=1
          mkdir -p resources
          mv esptool resources/esptool
          chmod +x resources/esptool

      - name: Inject release version
        if: inputs.version != ''
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: bun scripts/inject-version.ts

      - name: Build
        shell: bash
        run: |
          if [[ "${{ inputs.version }}" == *"-canary"* ]]; then
            bun run build:canary
          else
            bun run build:stable
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: electronbun-artifacts-${{ matrix.platform }}
          path: electronbun/artifacts/**
          if-no-files-found: error

  arduino-build:
    name: Arduino — Build Firmware
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arduino

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('arduino/platformio.ini') }}
          restore-keys: platformio-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: arduino-firmware
          path: arduino/.pio/build/d1_mini/firmware.bin
          if-no-files-found: error

