name: Deploy

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.2.0 or v1.2.0-canary)'
        type: string
        required: true

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # only publish arduino firmware binary to release - headless-rust binaries not deployed
      - name: Download firmware artifact
        uses: actions/download-artifact@v8
        with:
          name: arduino-firmware
          path: artifacts

      - name: List artifacts
        run: |
          echo "Artifacts to publish:"
          ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Speedcamera ${{ inputs.version }}
          draft: false
          prerelease: ${{ contains(inputs.version, '-canary') }}
          generate_release_notes: true
          files: artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

