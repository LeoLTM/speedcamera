name: Test

on:
  workflow_call:

defaults:
  run:
    working-directory: electronbun

jobs:
  test:
    name: Type-check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: TypeScript type-check
        run: bun tsc --noEmit

      - name: Lint
        run: bun run lint:ci
