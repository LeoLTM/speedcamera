name: CI - Main & Release

on:
  push:
    branches:
      - main
    paths:
      - 'headless-rust/**'
      - 'arduino/**'
      - '.github/workflows/**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      headless_rust: ${{ steps.filter.outputs.headless_rust == 'true' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
      arduino: ${{ steps.filter.outputs.arduino == 'true' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            headless_rust:
              - 'headless-rust/**'
              - '.github/workflows/**'
            arduino:
              - 'arduino/**'
              - '.github/workflows/**'

  test:
    needs: changes
    if: needs.changes.outputs.headless_rust == 'true'
    uses: ./.github/workflows/_test.yml
    secrets: inherit

  build:
    needs: [changes, test]
    if: ${{ !cancelled() && !failure() && (needs.changes.outputs.headless_rust == 'true' || needs.changes.outputs.arduino == 'true') }}
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      build-headless: ${{ needs.changes.outputs.headless_rust == 'true' }}
      build-firmware: ${{ needs.changes.outputs.arduino == 'true' }}
    secrets: inherit

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/_deploy.yml
    needs: [test, build]
    permissions:
      contents: write
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
