name: CI - PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'electronbun/**'
      - 'arduino/**'
      - '.github/workflows/**'

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      electronbun: ${{ steps.filter.outputs.electronbun }}
      arduino: ${{ steps.filter.outputs.arduino }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            electronbun:
              - 'electronbun/**'
              - '.github/workflows/**'
            arduino:
              - 'arduino/**'
              - '.github/workflows/**'

  test:
    needs: changes
    if: needs.changes.outputs.electronbun == 'true'
    uses: ./.github/workflows/_test.yml
    secrets: inherit

  build:
    needs: [changes, test]
    if: ${{ !cancelled() && !failure() && (needs.changes.outputs.electronbun == 'true' || needs.changes.outputs.arduino == 'true') }}
    uses: ./.github/workflows/_build.yml
    with:
      version: ''
      build-app: ${{ needs.changes.outputs.electronbun == 'true' }}
      build-firmware: ${{ needs.changes.outputs.arduino == 'true' }}
    secrets: inherit
