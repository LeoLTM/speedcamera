[package]
name = "headless-rust"
version = "0.5.0"
edition = "2024"
description = "Speedcamera daemon for Raspberry Pi 5: serial trigger pipeline, GigE camera capture and web UI"

[dependencies]
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
serialport = "4.9.0"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
fast_image_resize = { version = "5", features = ["rayon", "image"] }
rayon = "1.10"
imageproc = "0.25"
ab_glyph = "0.2"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
rust-embed = { version = "8.5", features = ["mime-guess"] }
mime_guess = "2.0"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
tokio-stream = "0.1"
nix = { version = "0.29", features = ["net"] }
url = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
socketioxide = "0.18.6"
embedded-graphics = "0.8"
ssd1306 = "0.10"
linux-embedded-hal = "0.5"

[build-dependencies]
pkg-config = "0.3"

# Raspberry Pi package, built by packaging/build-deb.sh (see README "Deployment").
[package.metadata.deb]
name = "speedcamera"
maintainer = "LeoLTM <44781682+LeoLTM@users.noreply.github.com>"
extended-description = """\
Reads the light-barrier speed sensor over serial, triggers the GigE camera, \
stores violations under /var/lib/speedcamera and serves the web UI on port 3000. \
Network modes (setup hotspot, Wi-Fi client, camera LAN) are switched through \
/usr/lib/speedcamera/setup-network.sh."""
section = "misc"
priority = "optional"
revision = ""
depends = "$auto, adduser, sudo, network-manager, dnsmasq-base, iw, iptables, rfkill"
recommends = "esptool"
maintainer-scripts = "packaging/debian/"
systemd-units = { enable = true }
assets = [
  ["target/release/headless-rust", "usr/bin/speedcamera", "755"],
  ["scripts/setup-network.sh", "usr/lib/speedcamera/setup-network.sh", "755"],
  ["packaging/files/sudoers", "etc/sudoers.d/speedcamera", "440"],
  ["packaging/files/default", "etc/default/speedcamera", "644"],
]
